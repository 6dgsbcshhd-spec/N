<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nexogram">
<title>Nexogram</title>
<style>
:root{--bg:#F2F2F6;--cd:#fff;--tx:#000;--mu:#8E8E93;--ac:#3B82F6;--in:#F2F2F6}
html[data-th=dark]{--bg:#000;--cd:#1C1C1E;--tx:#fff;--mu:#9a9aa0;--in:#2C2C2E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font:16px -apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .35s ease,color .25s ease}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.pg{flex:1;overflow:auto;padding:14px 14px 110px}.an>*{animation:in .38s cubic-bezier(.2,.8,.2,1) both}.an>*:nth-child(2){animation-delay:.04s}.an>*:nth-child(3){animation-delay:.08s}.an>*:nth-child(n+4){animation-delay:.12s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.85)}}
h1{margin:6px 4px 12px;font-size:30px}h2{margin:4px 0}small{color:var(--mu)}
input,textarea{width:100%;padding:13px;margin:0 0 10px;border:0;border-radius:14px;background:var(--cd);color:var(--tx);font:inherit;outline:0}
button{font:inherit;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .25s,background .25s,color .2s}button:active{transform:scale(.95);opacity:.8}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;margin-bottom:8px}.btn.red{background:#FF3B30}.btn.org{background:#FF9500}.btn.grn{background:#34C759}.btn.gr{background:var(--cd);color:var(--tx)}
.lnk{background:none;border:0;color:var(--ac);display:block;margin:12px auto}
.row{display:flex;align-items:center;gap:12px;background:var(--cd);padding:11px;border-radius:14px;margin-bottom:4px;transition:transform .15s}.row:active{transform:scale(.98)}
.t{flex:1;min-width:0}.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#8B5CF6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden;position:relative}.av img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#34C759;border:2px solid var(--cd)}
.i{display:inline-block;vertical-align:middle;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.bdg{display:block;font-size:11px;color:var(--ac);font-weight:700;letter-spacing:.3px}
.card{background:var(--cd);padding:14px;border-radius:14px;margin-bottom:10px}
nav{position:fixed;left:18px;right:18px;bottom:calc(16px + env(safe-area-inset-bottom));height:66px;display:flex;background:color-mix(in srgb,var(--cd) 85%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:32px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}nav .on{color:var(--ac);font-weight:700}nav .on .i{transform:scale(1.15)}nav .i{transition:transform .25s}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--cd)}.top button{background:none;border:0;color:var(--ac);padding:6px}
#ms{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:9px 12px;border-radius:18px;background:var(--cd);align-self:flex-start;word-wrap:break-word;animation:pop .22s}.b.me{background:var(--ac);color:#fff;align-self:flex-end}
.b img{max-width:100%;border-radius:12px;display:block}.b small{display:block;text-align:right;font-size:11px;color:inherit;opacity:.7}
.ib{display:flex;gap:8px;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--cd)}.ib input{margin:0;background:var(--in);border-radius:20px}.ib button{border:0;background:none;color:var(--mu);padding:4px}
.snd{width:42px;height:42px;border-radius:50%;background:var(--ac)!important;color:#fff!important;display:flex;align-items:center;justify-content:center}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g{border:0;background:var(--cd);border-radius:18px;padding:8px;text-align:center;font-size:12px;color:var(--tx)}.g svg{display:block;margin:0 auto 4px;width:100%;height:auto}
.sw{width:46px;height:28px;border-radius:14px;background:#aaa;position:relative;transition:.25s;flex:none}.sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}.sw.on{background:#34C759}.sw.on:after{left:21px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9;animation:in .4s;padding:20px}.env{animation:pu 1.2s infinite}@keyframes pu{50%{transform:scale(1.12)}}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.seg{display:flex;background:var(--cd);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:var(--tx);padding:9px;border-radius:10px}.seg .on{background:var(--ac);color:#fff}
.pbadge{color:#A855F7}

.gift-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.gift-head h1{margin-bottom:2px}.gift-balance{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;padding:10px 14px;border-radius:18px;font-weight:800}.gift-owned{background:var(--cd);border-radius:18px;padding:12px;margin-bottom:16px}.gift-owned .gr{margin-top:8px}.gift-tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 10px;scrollbar-width:none}.gift-tabs button{white-space:nowrap;border:0;border-radius:20px;padding:9px 13px;background:var(--cd);color:var(--tx);font-size:13px}.gift-tabs button.active{background:var(--ac);color:white}.gift-market-title{display:flex;justify-content:space-between;align-items:center;margin:10px 2px}.gift-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.gift-card{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px!important;border:1px solid color-mix(in srgb,var(--ac) 18%,transparent)!important;background:linear-gradient(145deg,var(--cd),color-mix(in srgb,var(--ac) 7%,var(--cd)))!important}.gift-card b{font-size:13px}.gift-card small{font-size:11px}.gift-glow{display:block;filter:drop-shadow(0 8px 15px rgba(80,100,255,.24))}.gift-art{animation:giftFloat 3.5s ease-in-out infinite;transform-origin:50% 55%}.gift-flame{animation:giftFlame 1.3s ease-in-out infinite alternate}.gift-star{animation:giftSpin 9s linear infinite}.gift-ring{animation:giftFloat 2.7s ease-in-out infinite}.gift-book{animation:giftFloat 3s ease-in-out infinite}.gift-book .book-pages{transform-origin:50% 50%;animation:bookFlip .42s ease-in-out infinite alternate}.gift-book .book-pages path:first-child{transform-origin:50% 50%;animation:bookPage .55s ease-in-out infinite alternate}@keyframes bookFlip{from{transform:perspective(180px) rotateY(-9deg)}to{transform:perspective(180px) rotateY(9deg)}}@keyframes bookPage{from{opacity:.72;transform:scaleX(.9)}to{opacity:1;transform:scaleX(1)}}.gift-modal{position:fixed;inset:0;z-index:50;background:#0009;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:22px}.gift-modal-card{position:relative;width:100%;max-width:330px;background:var(--cd);border-radius:26px;padding:28px 22px;text-align:center;box-shadow:0 24px 80px #0006;animation:pop .25s ease-out}.gift-modal-card svg{filter:drop-shadow(0 12px 24px #7c3aed55)}.gift-modal-card h2{margin:12px 0 4px}.gift-close{position:absolute;right:12px;top:8px;border:0;background:var(--in);color:var(--tx);border-radius:50%;width:32px;height:32px;font-size:23px}.gift-modal-card .btn{margin-top:18px}@keyframes giftFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}@keyframes giftFlame{from{transform:scale(.94) rotate(-3deg)}to{transform:scale(1.06) rotate(3deg)}}@keyframes giftSpin{to{transform:rotate(360deg)}}

const shrink=(f,max,qq)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',qq))};im.src=fr.result};fr.readAsDataURL(f)});
async function sendMsg(o,last,pid=peer?.id){const id=cid(pid);
  if(U(pid)?.blocked?.includes(user.uid))return alert('Пользователь вас заблокировал');
  if(me.blocked?.includes(pid))return alert('Вы заблокировали этого пользователя');
  try{if(chats.some(c=>c.id===id))await updateDoc(doc(db,'chats',id),{lastMessage:last,updatedAt:serverTimestamp()});
    else await setDoc(doc(db,'chats',id),{participants:[user.uid,pid].sort(),lastMessage:last,updatedAt:serverTimestamp()})}catch(x){return alert('Ошибка шаг 1 (чат): '+x.message)}
  try{await addDoc(collection(db,'chats',id,'messages'),{text:'',...o,from:user.uid,read:false,createdAt:serverTimestamp()});return true}catch(x){alert('Ошибка шаг 2 (сообщение): '+x.message);return false}}

async function recordMedia(type){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return alert('Запись недоступна в этом браузере или требуется HTTPS');try{const stream=await navigator.mediaDevices.getUserMedia(type==='video'?{audio:true,video:{facingMode:'user'}}:{audio:true});if(mediaRec){mediaRec.stop();return}mediaChunks=[];mediaRec=new MediaRecorder(stream);mediaRec.ondataavailable=e=>{if(e.data.size)mediaChunks.push(e.data)};mediaRec.onstop=async()=>{const blob=new Blob(mediaChunks,{type:mediaRec.mimeType|| (type==='video'?'video/webm':'audio/webm')});stream.getTracks().forEach(t=>t.stop());mediaRec=null;if(blob.size>650000){alert('Файл слишком большой для текущего хранения. Для длинных записей нужно подключить Firebase Storage.');return}const reader=new FileReader();reader.onload=async()=>{await sendMsg({media:reader.result,mediaType:type},type==='video'?'Видеосообщение':'Голосовое сообщение')};reader.readAsDataURL(blob)};mediaRec.start();alert('Запись началась. Нажми эту же кнопку ещё раз, чтобы отправить.')}catch(e){alert('Нет доступа к микрофону/камере: '+e.message)}}

  async tpNo(d){const r=prompt('Причина отказа');if(r===null)return;await updateDoc(doc(db,'topups',d.t),{status:'no',reason:r||'без причины'}).catch(x=>alert(x.message))},
  gcat(d){giftCategory=d.c;render()},gplus(){alert('Звёзды выдаёт администрация (Настройки → Панель разработчика)')},
  gprev(d){const g=GIFTS.find(x=>x[0]===d.g),own=(me.gifts||[]).includes(g[0]);modal(`<div class="gift-modal-card" style="background:#12121f;color:#fff"><button class="gift-close" data-a="mclose">×</button>${gs(g[0],'100%')}<h2>${g[1]}</h2><small style="color:#aab">№ ${g[8]} · ${g[7]} · ${g[6]}</small><h3>${I('star',18)} ${g[5].toLocaleString('en-US')}</h3>${own?'<button class="btn gr" disabled>Уже в коллекции</button>':`<button class="btn" data-a="buy" data-g="${g[0]}">Купить за звёзды</button>`}</div>`)},
  async buy(d){if(me.arrested)return alert('Счёт арестован администратором');if(me.starsFrozen)return alert('Звёзды арестованы администрацией');const g=GIFTS.find(x=>x[0]===d.g);if(me.gifts?.includes(g[0]))return alert('Уже в коллекции');if((me.balance||0)<g[5])return alert('Не хватает звёзд. Баланс: '+(me.balance||0));closeModal();await upd(user.uid,{balance:increment(-g[5]),gifts:arrayUnion(g[0])}).catch(x=>alert(x.message))},
  async gsend(d){if(me.arrested)return alert('Счёт арестован администратором');if(me.starsFrozen)return alert('Звёзды арестованы администрацией');const g=GIFTS.find(x=>x[0]===d.g);if((me.balance||0)<g[5])return alert('Не хватает звёзд. Баланс: '+(me.balance||0));
    const note=prompt('Подпись к подарку (необязательно)','');if(note===null)return;closeModal();
    if(await sendMsg({gift:g[0],price:g[5],text:note},'Подарок'))await upd(user.uid,{balance:increment(-g[5])}).catch(x=>alert('Ошибка оплаты: '+x.message))},
  pickVideoAvatar(){if(!me.premium)return alert('Функция доступна Premium');$('#fv').click()},
  async frame(d){if(!me.premium)return alert('Рамки доступны только Premium');await upd(user.uid,{frame:d.f||null}).catch(x=>alert(x.message))},

};

$('#fv').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!me.premium)return alert('Только Premium');
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(f);
  try{await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=j;v.load()})}catch(x){return alert('Не удалось открыть видео')}
  const dur=Math.min(v.duration||3,3),n=12,c=document.createElement('canvas');c.width=c.height=112;const g=c.getContext('2d'),fr=[];
  for(let k=0;k<n;k++){v.currentTime=dur*k/n;await new Promise(r=>{v.onseeked=r;setTimeout(r,1500)});const sz=Math.min(v.videoWidth,v.videoHeight);g.drawImage(v,(v.videoWidth-sz)/2,(v.videoHeight-sz)/2,sz,sz,0,0,112,112);fr.push(c.toDataURL('image/jpeg',.6))}
  URL.revokeObjectURL(v.src);try{await upd(user.uid,{videoFrames:fr});alert('Видеоаватар установлен')}catch(x){alert(x.message)}});
let _fi=0;setInterval(()=>{_fi++;document.querySelectorAll('img.vf').forEach(im=>{const u=U(im.dataset.u),f=u?.videoFrames;if(f?.length)im.src=f[_fi%f.length]})},130);
